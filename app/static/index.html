<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#183e34">
  <meta name="description" content="Your private coffee library, brew recipes, and xBloom card workspace.">
  <title>Bloom — Local Recipe Manager</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' rx='14' fill='%23183e34'/%3E%3Cpath d='M24 8v32M8 24h32M13 13l22 22M13 35l22-22' stroke='%23cfe3b6' stroke-width='4'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/styles.css">
  <script src="/static/app.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="shell">
    <aside class="sidebar" id="sidebar" aria-label="Workspace navigation">
      <a class="brand" href="#overview" aria-label="Bloom home"><span class="brand-symbol" aria-hidden="true">✳</span><span>bloom<span class="brand-caption">LOCAL RECIPE MANAGER</span></span></a>
      <div class="workspace-label">YOUR WORKSPACE</div>
      <nav class="nav" id="navigation"></nav>
      <div class="sidebar-bottom">
        <div class="local-note"><span class="status-dot"></span><span>Made for your local network<small>Your coffee. Your own space.</small></span></div>
        <div class="sidebar-machine"><span class="machine-icon" data-icon="coffee"></span><div><strong>xBloom Studio</strong><span>Offline brewing · NFC cards</span></div></div>
      </div>
    </aside>
    <button class="nav-backdrop" id="nav-backdrop" aria-label="Close navigation" hidden></button>
    <div class="workspace">
      <header class="topbar">
        <button class="icon-button menu-button" id="menu-toggle" aria-label="Open navigation" aria-expanded="false" aria-controls="sidebar"><span data-icon="menu"></span></button>
        <div class="breadcrumbs"><span>Workspace</span><span class="crumb-slash">/</span><strong id="breadcrumb">Overview</strong></div>
        <div class="topbar-actions"><span class="local-badge"><span data-icon="shield"></span>Local workspace</span><button class="button button-small button-outline" data-action="import"><span data-icon="upload"></span><span>Import profile</span></button><button class="avatar" id="session-button" aria-label="Account and settings">J</button></div>
      </header>
      <main id="main" tabindex="-1"><div class="loading-state"><span class="spinner"></span><p>Opening your workspace…</p></div></main>
      <footer class="page-footer"><span>Thoughtful recipes. Better everyday coffee.</span><span>Self-hosted · xBloom Studio</span></footer>
    </div>
  </div>
  <dialog id="modal" class="modal"><div id="modal-content"></div></dialog>
  <div id="toasts" class="toasts" aria-live="polite" aria-atomic="false"></div>
  <div id="connection-banner" class="connection-banner" role="status" hidden></div>
  <noscript><div class="noscript">Enable JavaScript to use your local recipe workspace.</div></noscript>
</body>
</html>
